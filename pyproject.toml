[project]
name = "agente-atendimento"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "joao kelvin", email = "jkelvindev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
agente-atendimento = "agente_atendimento:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
